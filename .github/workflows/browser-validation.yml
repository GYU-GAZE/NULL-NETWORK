name: Browser Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI-only asset placeholders
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot /tmp/project.godot.original

          while IFS= read -r -d '' import_file; do
            source_file="${import_file%.import}"

            if [ ! -f "$source_file" ]; then
              extension="${source_file##*.}"

              case "$extension" in
                png)
                  printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4////fwAJ+wP9KobjigAAAABJRU5ErkJggg==' \
                    | base64 --decode > "$source_file"
                  ;;
                ttf)
                  cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$source_file"
                  ;;
                *)
                  echo "Unsupported missing asset type: $source_file"
                  exit 1
                  ;;
              esac
            fi

            rm -f "$import_file"
          done < <(find data -type f -name '*.import' -print0)

          sed -i '/^theme\/custom=/d' project.godot

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --editor --path . --import --verbose \
            2>&1 | tee godot-browser-import.log

      - name: Run Browser page-scroll bounds test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 300 \
            tests/browser/browser_page_scroll_origin_test.tscn \
            2>&1 | tee browser-page-scroll-origin-test.log
          grep -q "BROWSER_PAGE_SCROLL_ORIGIN_TEST: PASS" browser-page-scroll-origin-test.log

      - name: Run Browser responsive site layout test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 1200 \
            tests/browser/browser_responsive_site_layout_test.tscn \
            2>&1 | tee browser-responsive-site-layout-test.log
          grep -q "BROWSER_RESPONSIVE_SITE_LAYOUT_TEST: PASS" browser-responsive-site-layout-test.log

      - name: Run NULL NETWORK homepage test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 300 \
            tests/browser/null_network_home_test.tscn \
            2>&1 | tee null-network-home-test.log
          grep -q "NULL_NETWORK_HOME_TEST: PASS" null-network-home-test.log

      - name: Run Browser tab-order test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 300 \
            tests/browser/browser_tab_order_test.tscn \
            2>&1 | tee browser-tab-order-test.log
          grep -q "BROWSER_TAB_ORDER_TEST: PASS" browser-tab-order-test.log

      - name: Run SiteActionData test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 300 \
            tests/browser/site_action_data_test.tscn \
            2>&1 | tee site-action-data-test.log
          grep -q "SITE_ACTION_DATA_TEST: PASS" site-action-data-test.log

      - name: Run WebsiteCatalog test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 300 \
            tests/browser/website_catalog_test.tscn \
            2>&1 | tee website-catalog-test.log
          grep -q "WEBSITE_CATALOG_TEST: PASS" website-catalog-test.log

      - name: Run Browser authoring acceptance and contract units
        shell: bash
        run: |
          set -o pipefail
          timeout 90s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . tests/browser/browser_authoring_pipeline_test.tscn 2>&1 | tee browser-authoring-pipeline-test.log
          grep -q "BROWSER_AUTHORING_PIPELINE_TEST: PASS" browser-authoring-pipeline-test.log
          timeout 30s ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . tests/browser/browser_contract_unit_test.tscn 2>&1 | tee browser-contract-unit-test.log
          grep -q "BROWSER_CONTRACT_UNIT_TEST: PASS" browser-contract-unit-test.log

      - name: Verify production authoring plugin in isolated Editor
        shell: bash
        run: |
          python3 tests/browser/run_editor_smoke.py \
            --godot ./Godot_v4.6.3-stable_linux.x86_64 \
            --workspace "$RUNNER_TEMP/nnw-website-editor" \
            --output "$GITHUB_WORKSPACE/website-authoring-editor.log" \
            --headless

      - name: Reject Browser script and resource errors
        shell: bash
        run: |
          set -euo pipefail
          cat \
            godot-browser-import.log \
            browser-authoring-pipeline-test.log \
            browser-contract-unit-test.log \
            browser-page-scroll-origin-test.log \
            browser-responsive-site-layout-test.log \
            null-network-home-test.log \
            browser-tab-order-test.log \
            site-action-data-test.log \
            website-catalog-test.log \
            > godot-browser-validation.log

          for marker in \
            "BROWSER_PAGE_SCROLL_ORIGIN_TEST: PASS|browser-page-scroll-origin-test.log" \
            "BROWSER_RESPONSIVE_SITE_LAYOUT_TEST: PASS|browser-responsive-site-layout-test.log" \
            "NULL_NETWORK_HOME_TEST: PASS|null-network-home-test.log" \
            "BROWSER_TAB_ORDER_TEST: PASS|browser-tab-order-test.log" \
            "SITE_ACTION_DATA_TEST: PASS|site-action-data-test.log" \
            "WEBSITE_CATALOG_TEST: PASS|website-catalog-test.log"; do
            expected="${marker%%|*}"
            logfile="${marker#*|}"
            grep -q "$expected" "$logfile" || {
              echo "Missing validation marker: $expected in $logfile"
              exit 1
            }
          done

          if grep -E "BROWSER_AUTHORING_PIPELINE_TEST: FAIL|BROWSER_CONTRACT_UNIT_TEST: FAIL|SCRIPT ERROR|Failed to load script|Cannot get class|Parse Error|BROWSER_PAGE_SCROLL_ORIGIN_TEST: FAIL|BROWSER_RESPONSIVE_SITE_LAYOUT_TEST: FAIL|NULL_NETWORK_HOME_TEST: FAIL|BROWSER_TAB_ORDER_TEST: FAIL|SITE_ACTION_DATA_TEST: FAIL|WEBSITE_CATALOG_TEST: FAIL" godot-browser-validation.log; then
            exit 1
          fi

      - name: Restore project settings
        if: always()
        run: cp /tmp/project.godot.original project.godot

      - name: Upload Browser validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation-log
          path: |
            godot-browser-import.log
            browser-authoring-pipeline-test.log
            browser-contract-unit-test.log
            website-authoring-editor.log
            website-authoring-editor.import.log
            browser-page-scroll-origin-test.log
            browser-responsive-site-layout-test.log
            null-network-home-test.log
            browser-tab-order-test.log
            site-action-data-test.log
            website-catalog-test.log
            godot-browser-validation.log
          if-no-files-found: ignore
