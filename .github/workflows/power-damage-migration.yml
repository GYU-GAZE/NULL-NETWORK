name: Apply Power Damage Migration

on:
  push:
    branches:
      - balance/power-damage-heal-scaling
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: balance/power-damage-heal-scaling

      - name: Patch CombatManager integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/combat/combat_manager.gd')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''\t\t\t\t\teffect,\n\t\t\t\t\tcontext,\n\t\t\t\t\tvirtual_barriers\n\t\t\t\t)''',
              '''\t\t\t\t\teffect,\n\t\t\t\t\tcontext,\n\t\t\t\t\tvirtual_barriers,\n\t\t\t\t\ttargets.size()\n\t\t\t\t)''',
              'preview target count'
          )

          replace_once(
              '''\t\tfor target in targets:\n\t\t\t_execute_effect_on_target(\n\t\t\t\tcaster,\n\t\t\t\ttarget,\n\t\t\t\tmodule,\n\t\t\t\teffect,\n\t\t\t\tcontext,\n\t\t\t\tholder,\n\t\t\t\tstatus_instance\n\t\t\t)''',
              '''\t\tfor target in targets:\n\t\t\t_execute_effect_on_target(\n\t\t\t\tcaster,\n\t\t\t\ttarget,\n\t\t\t\tmodule,\n\t\t\t\teffect,\n\t\t\t\tcontext,\n\t\t\t\tholder,\n\t\t\t\tstatus_instance,\n\t\t\t\ttargets.size()\n\t\t\t)''',
              'runtime target count'
          )

          replace_once(
              '''func _execute_effect_on_target(\n\tcaster: Dictionary,\n\ttarget: Dictionary,\n\tmodule: ModuleData,\n\teffect: CombatEffectData,\n\tcontext: CombatEventContext,\n\tholder: Dictionary,\n\tstatus_instance: CombatStatusInstance\n) -> void:''',
              '''func _execute_effect_on_target(\n\tcaster: Dictionary,\n\ttarget: Dictionary,\n\tmodule: ModuleData,\n\teffect: CombatEffectData,\n\tcontext: CombatEventContext,\n\tholder: Dictionary,\n\tstatus_instance: CombatStatusInstance,\n\tresolved_target_count: int = 1\n) -> void:''',
              'effect target signature'
          )

          replace_once(
              '''\t\t\t_apply_damage(\n\t\t\t\tcaster,\n\t\t\t\ttarget,\n\t\t\t\tmodule,\n\t\t\t\teffect,\n\t\t\t\tamount,\n\t\t\t\tcontext,\n\t\t\t\tstatus_instance\n\t\t\t)''',
              '''\t\t\t_apply_damage(\n\t\t\t\tcaster,\n\t\t\t\ttarget,\n\t\t\t\tmodule,\n\t\t\t\teffect,\n\t\t\t\tamount,\n\t\t\t\tcontext,\n\t\t\t\tstatus_instance,\n\t\t\t\tresolved_target_count\n\t\t\t)''',
              'damage target count'
          )

          replace_once(
              '''func _apply_damage(\n\tcaster: Dictionary,\n\toriginal_target: Dictionary,\n\tmodule: ModuleData,\n\teffect: CombatEffectData,\n\traw_amount: float,\n\tparent_context: CombatEventContext,\n\tstatus_instance: CombatStatusInstance = null\n) -> void:''',
              '''func _apply_damage(\n\tcaster: Dictionary,\n\toriginal_target: Dictionary,\n\tmodule: ModuleData,\n\teffect: CombatEffectData,\n\traw_amount: float,\n\tparent_context: CombatEventContext,\n\tstatus_instance: CombatStatusInstance = null,\n\tresolved_target_count: int = 1\n) -> void:''',
              'apply damage signature'
          )

          replace_once(
              '''\tvar damage := _calculate_damage(\n\t\tcaster,\n\t\ttarget,\n\t\teffect,\n\t\traw_amount\n\t)''',
              '''\tvar damage := _calculate_damage(\n\t\tcaster,\n\t\ttarget,\n\t\teffect,\n\t\traw_amount,\n\t\tresolved_target_count\n\t)''',
              'runtime calculate damage call'
          )

          replace_once(
              '''func _calculate_damage(\n\tcaster: Dictionary,\n\ttarget: Dictionary,\n\teffect: CombatEffectData,\n\traw_amount: float\n) -> int:\n\tvar damage := maxf(\n\t\t0.0,\n\t\traw_amount\n\t)\n\n\tif not effect.ignore_defense:\n\t\tdamage -= get_effective_stat(\n\t\t\ttarget,\n\t\t\teffect.defense_stat\n\t\t)\n\n\tdamage = maxf(1.0, damage)\n\tdamage *= _continuous_multiplier(\n\t\tcaster,\n\t\tCombatEffectData.EffectType.MODIFY_DAMAGE_DEALT\n\t)\n\tdamage *= _continuous_multiplier(\n\t\ttarget,\n\t\tCombatEffectData.EffectType.MODIFY_DAMAGE_TAKEN\n\t)\n\treturn maxi(\n\t\t1,\n\t\tint(roundf(damage))\n\t)''',
              '''func _calculate_damage(\n\tcaster: Dictionary,\n\ttarget: Dictionary,\n\teffect: CombatEffectData,\n\traw_amount: float,\n\tresolved_target_count: int = 1\n) -> int:\n\tvar damage: float = 0.0\n\n\tif effect.damage_formula != null:\n\t\tvar formula: CombatDamageFormulaData = effect.damage_formula\n\t\tvar offense: float = _base_stat(\n\t\t\tcaster,\n\t\t\tformula.offense_stat\n\t\t)\n\t\tvar defense: float = _base_stat(\n\t\t\ttarget,\n\t\t\tformula.defense_stat\n\t\t)\n\n\t\tif formula.use_effective_offense:\n\t\t\toffense = get_effective_stat(\n\t\t\t\tcaster,\n\t\t\t\tformula.offense_stat\n\t\t\t)\n\n\t\tif formula.use_effective_defense:\n\t\t\tdefense = get_effective_stat(\n\t\t\t\ttarget,\n\t\t\t\tformula.defense_stat\n\t\t\t)\n\n\t\tdamage = float(formula.calculate_base_damage(\n\t\t\tint(caster.get("level", 1)),\n\t\t\toffense,\n\t\t\tdefense\n\t\t))\n\t\tdamage *= formula.get_target_multiplier(\n\t\t\tresolved_target_count\n\t\t)\n\t\tdamage *= formula.special_multiplier\n\telse:\n\t\tdamage = maxf(\n\t\t\t0.0,\n\t\t\traw_amount\n\t\t)\n\n\t\tif not effect.ignore_defense:\n\t\t\tdamage -= get_effective_stat(\n\t\t\t\ttarget,\n\t\t\t\teffect.defense_stat\n\t\t\t)\n\n\t\tdamage = maxf(1.0, damage)\n\n\tdamage *= _continuous_multiplier(\n\t\tcaster,\n\t\tCombatEffectData.EffectType.MODIFY_DAMAGE_DEALT\n\t)\n\tdamage *= _continuous_multiplier(\n\t\ttarget,\n\t\tCombatEffectData.EffectType.MODIFY_DAMAGE_TAKEN\n\t)\n\treturn maxi(\n\t\t1,\n\t\tint(roundf(damage))\n\t)''',
              'Power damage calculation'
          )

          replace_once(
              '''\t\tvalue += (\n\t\t\tstat_value\n\t\t\t* formula.stat_multiplier\n\t\t)\n\n\tif (\n\t\tstatus_instance != null''',
              '''\t\tvalue += (\n\t\t\tstat_value\n\t\t\t* formula.stat_multiplier\n\t\t)\n\n\tvar secondary_reference_actor: Variant = _resolve_formula_actor(\n\t\tformula.secondary_stat_reference,\n\t\tcaster,\n\t\ttarget,\n\t\tholder,\n\t\tcontext\n\t)\n\n\tif (\n\t\tsecondary_reference_actor != null\n\t\tand not is_zero_approx(\n\t\t\tformula.secondary_stat_multiplier\n\t\t)\n\t):\n\t\tvar secondary_stat_value := _base_stat(\n\t\t\tsecondary_reference_actor,\n\t\t\tformula.secondary_stat\n\t\t)\n\n\t\tif formula.secondary_use_effective_stat:\n\t\t\tsecondary_stat_value = _get_effective_stat(\n\t\t\t\tsecondary_reference_actor,\n\t\t\t\tformula.secondary_stat,\n\t\t\t\tstat_depth + 1\n\t\t\t)\n\n\t\tvalue += (\n\t\t\tsecondary_stat_value\n\t\t\t* formula.secondary_stat_multiplier\n\t\t)\n\n\tif (\n\t\tstatus_instance != null''',
              'secondary stat formula evaluation'
          )

          replace_once(
              '''func _preview_effect(\n\tcaster: Dictionary,\n\ttarget: Dictionary,\n\tmodule: ModuleData,\n\teffect: CombatEffectData,\n\tcontext: CombatEventContext,\n\tvirtual_barriers: Dictionary\n) -> Dictionary:''',
              '''func _preview_effect(\n\tcaster: Dictionary,\n\ttarget: Dictionary,\n\tmodule: ModuleData,\n\teffect: CombatEffectData,\n\tcontext: CombatEventContext,\n\tvirtual_barriers: Dictionary,\n\tresolved_target_count: int = 1\n) -> Dictionary:''',
              'preview signature'
          )

          replace_once(
              '''\t\t\tvar damage := _calculate_damage(\n\t\t\t\tcaster,\n\t\t\t\ttarget,\n\t\t\t\teffect,\n\t\t\t\tamount\n\t\t\t)''',
              '''\t\t\tvar damage := _calculate_damage(\n\t\t\t\tcaster,\n\t\t\t\ttarget,\n\t\t\t\teffect,\n\t\t\t\tamount,\n\t\t\t\tresolved_target_count\n\t\t\t)''',
              'preview calculate damage call'
          )

          path.write_text(text)
          PY

      - name: Prepare CI-only asset placeholders
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot /tmp/project.godot.original

          while IFS= read -r -d '' import_file; do
            source_file="${import_file%.import}"
            if [ ! -f "$source_file" ]; then
              extension="${source_file##*.}"
              echo "Missing raw asset: $source_file"
              case "$extension" in
                png)
                  printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4////fwAJ+wP9KobjigAAAABJRU5ErkJggg==' | base64 --decode > "$source_file"
                  ;;
                ttf)
                  cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$source_file"
                  ;;
                *)
                  echo "Unsupported missing asset type: $source_file"
                  exit 1
                  ;;
              esac
            fi
            rm -f "$import_file"
          done < <(find data -type f -name '*.import' -print0)

          sed -i '/^theme\/custom=/d' project.godot

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 --output godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee godot-import.log

      - name: Run combat numbers formula test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 60 tests/combat/combat_numbers_formula_test.tscn 2>&1 | tee combat-numbers-test.log
          grep -q "COMBAT_NUMBERS_FORMULA_TEST: PASS" combat-numbers-test.log

      - name: Run APK progression test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 180 tests/progression/apk_progression_test.tscn 2>&1 | tee apk-progression-test.log
          grep -q "APK_PROGRESSION_TEST: PASS" apk-progression-test.log

      - name: Restore project settings
        if: always()
        run: cp /tmp/project.godot.original project.godot

      - name: Commit migration
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/combat/combat_manager.gd
          git commit -m "combat: integrate Power damage and secondary formula scaling"
          git push origin HEAD:balance/power-damage-heal-scaling
