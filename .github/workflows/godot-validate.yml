name: Godot Project Validation

on:
  push:
    branches:
      - main
      - refactor/adaptive-display-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI-only asset placeholders
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot /tmp/project.godot.original

          while IFS= read -r -d '' import_file; do
            source_file="${import_file%.import}"

            if [ ! -f "$source_file" ]; then
              extension="${source_file##*.}"
              echo "Missing raw asset: $source_file"

              case "$extension" in
                png)
                  printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4////fwAJ+wP9KobjigAAAABJRU5ErkJggg==' \
                    | base64 --decode > "$source_file"
                  ;;
                ttf)
                  cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$source_file"
                  ;;
                *)
                  echo "Unsupported missing asset type: $source_file"
                  exit 1
                  ;;
              esac
            fi

            rm -f "$import_file"
          done < <(find data -type f -name '*.import' -print0)

          sed -i '/^theme\/custom=/d' project.godot

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --import \
            --verbose 2>&1 | tee godot-import.log

      - name: Run main scene headlessly
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 2 \
            --verbose \
            core/bootstrap/bootstrap.tscn 2>&1 | tee godot-runtime.log

      - name: Run combat runtime test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 60 \
            tests/combat/combat_runtime_test.tscn \
            2>&1 | tee godot-combat-test.log

      - name: Run activity manager test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 30 \
            tests/activity/activity_manager_test.tscn \
            2>&1 | tee godot-activity-test.log

      - name: Run campaign state test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 30 \
            tests/campaign/campaign_state_test.tscn \
            2>&1 | tee godot-campaign-test.log

      - name: Run conditions and effects test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 30 \
            tests/conditions/conditions_effects_test.tscn \
            2>&1 | tee godot-conditions-effects-test.log

      - name: Run app catalog test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 30 \
            tests/apps/app_catalog_test.tscn \
            2>&1 | tee godot-app-catalog-test.log

      - name: Run story event manager test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 180 \
            tests/events/story_event_manager_test.tscn \
            2>&1 | tee godot-story-event-test.log

      - name: Run dialogue system test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 240 \
            tests/dialogue/dialogue_system_test.tscn \
            2>&1 | tee godot-dialogue-test.log

      - name: Run Operator creation test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 180 \
            tests/operator/operator_creation_test.tscn \
            2>&1 | tee godot-operator-test.log

      - name: Run APK progression test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 180 \
            tests/progression/apk_progression_test.tscn \
            2>&1 | tee godot-apk-progression-test.log

      - name: Run save manager test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 30 \
            tests/save/save_manager_test.tscn \
            2>&1 | tee godot-save-test.log

      - name: Run save runtime integration test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 60 \
            tests/save/save_runtime_integration_test.tscn \
            2>&1 | tee godot-save-runtime-test.log

      - name: Run combat layout test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 30 \
            tests/combat/combat_layout_test.tscn \
            2>&1 | tee godot-combat-layout-test.log

      - name: Restore project settings
        if: always()
        run: cp /tmp/project.godot.original project.godot

      - name: Reject script and resource errors
        run: |
          cat \
            godot-import.log \
            godot-runtime.log \
            godot-combat-test.log \
            godot-activity-test.log \
            godot-campaign-test.log \
            godot-conditions-effects-test.log \
            godot-app-catalog-test.log \
            godot-story-event-test.log \
            godot-dialogue-test.log \
            godot-operator-test.log \
            godot-apk-progression-test.log \
            godot-save-test.log \
            godot-save-runtime-test.log \
            godot-combat-layout-test.log \
            > godot-validation.log

          if grep -E "SCRIPT ERROR|Failed to load script|Cannot get class" godot-validation.log; then
            echo "Godot reported a script error."
            exit 1
          fi

          if grep -E "COMBAT_RUNTIME_TEST: " godot-combat-test.log \
            | grep -v "COMBAT_RUNTIME_TEST: PASS"; then
            echo "The combat runtime test reported an error."
            exit 1
          fi

          grep -q "COMBAT_RUNTIME_TEST: PASS" godot-combat-test.log

          if grep -E "ACTIVITY_MANAGER_TEST: " godot-activity-test.log \
            | grep -v "ACTIVITY_MANAGER_TEST: PASS"; then
            echo "The activity manager test reported an error."
            exit 1
          fi

          grep -q "ACTIVITY_MANAGER_TEST: PASS" godot-activity-test.log

          if grep -E "CAMPAIGN_STATE_TEST: " godot-campaign-test.log \
            | grep -v "CAMPAIGN_STATE_TEST: PASS"; then
            echo "The campaign state test reported an error."
            exit 1
          fi

          grep -q "CAMPAIGN_STATE_TEST: PASS" godot-campaign-test.log

          if grep -E "CONDITIONS_EFFECTS_TEST: " godot-conditions-effects-test.log \
            | grep -v "CONDITIONS_EFFECTS_TEST: PASS"; then
            echo "The conditions and effects test reported an error."
            exit 1
          fi

          grep -q "CONDITIONS_EFFECTS_TEST: PASS" godot-conditions-effects-test.log

          if grep -E "APP_CATALOG_TEST: " godot-app-catalog-test.log \
            | grep -v "APP_CATALOG_TEST: PASS"; then
            echo "The app catalog test reported an error."
            exit 1
          fi

          grep -q "APP_CATALOG_TEST: PASS" godot-app-catalog-test.log

          if grep -E "STORY_EVENT_MANAGER_TEST: " godot-story-event-test.log \
            | grep -v "STORY_EVENT_MANAGER_TEST: PASS"; then
            echo "The story event manager test reported an error."
            exit 1
          fi

          grep -q "STORY_EVENT_MANAGER_TEST: PASS" godot-story-event-test.log

          if grep -E "DIALOGUE_SYSTEM_TEST: " godot-dialogue-test.log \
            | grep -v "DIALOGUE_SYSTEM_TEST: PASS"; then
            echo "The dialogue system test reported an error."
            exit 1
          fi

          grep -q "DIALOGUE_SYSTEM_TEST: PASS" godot-dialogue-test.log

          if grep -E "OPERATOR_CREATION_TEST: " godot-operator-test.log \
            | grep -v "OPERATOR_CREATION_TEST: PASS"; then
            echo "The Operator creation test reported an error."
            exit 1
          fi

          grep -q "OPERATOR_CREATION_TEST: PASS" godot-operator-test.log

          if grep -E "APK_PROGRESSION_TEST: " godot-apk-progression-test.log \
            | grep -v "APK_PROGRESSION_TEST: PASS"; then
            echo "The APK progression test reported an error."
            exit 1
          fi

          grep -q "APK_PROGRESSION_TEST: PASS" godot-apk-progression-test.log

          if grep -E "SAVE_MANAGER_TEST: " godot-save-test.log \
            | grep -v "SAVE_MANAGER_TEST: PASS"; then
            echo "The save manager test reported an error."
            exit 1
          fi

          grep -q "SAVE_MANAGER_TEST: PASS" godot-save-test.log

          if grep -E "SAVE_RUNTIME_INTEGRATION_TEST: " godot-save-runtime-test.log \
            | grep -v "SAVE_RUNTIME_INTEGRATION_TEST: PASS"; then
            echo "The save runtime integration test reported an error."
            exit 1
          fi

          grep -q "SAVE_RUNTIME_INTEGRATION_TEST: PASS" godot-save-runtime-test.log

          if grep -E "COMBAT_LAYOUT_TEST: " godot-combat-layout-test.log \
            | grep -v "COMBAT_LAYOUT_TEST: PASS"; then
            echo "The combat layout test reported an error."
            exit 1
          fi

          grep -q "COMBAT_LAYOUT_TEST: PASS" godot-combat-layout-test.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-log
          path: |
            godot-import.log
            godot-runtime.log
            godot-combat-test.log
            godot-activity-test.log
            godot-campaign-test.log
            godot-conditions-effects-test.log
            godot-app-catalog-test.log
            godot-story-event-test.log
            godot-dialogue-test.log
            godot-operator-test.log
            godot-apk-progression-test.log
            godot-save-test.log
            godot-save-runtime-test.log
            godot-combat-layout-test.log
            godot-validation.log
          if-no-files-found: ignore
