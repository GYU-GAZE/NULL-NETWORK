name: Godot Project Validation

on:
  push:
    branches:
      - main
      - refactor/adaptive-display-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision CI-only fallback font
        run: |
          if [ ! -f data/assets/fonts/Silver.ttf ]; then
            echo "Silver.ttf is not versioned; using DejaVu Sans only for headless validation."
            cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf data/assets/fonts/Silver.ttf
          fi

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import and validate project
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --quit-after 2 \
            --verbose 2>&1 | tee godot-validation.log

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot get class" godot-validation.log; then
            echo "Godot reported script or resource loading errors."
            exit 1
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-log
          path: godot-validation.log
          if-no-files-found: ignore
