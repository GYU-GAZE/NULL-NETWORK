name: Godot Project Validation

on:
  push:
    branches:
      - main
      - refactor/adaptive-display-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI project copy
        run: |
          echo "The repository does not contain Silver.ttf; disabling only the custom theme in the runner copy."
          sed -i '/^theme\/custom=/d' project.godot

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --quit-after 2 \
            --verbose 2>&1 | tee godot-import.log

      - name: Run main scene headlessly
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 2 \
            --verbose 2>&1 | tee godot-runtime.log

      - name: Reject script and resource errors
        run: |
          cat godot-import.log godot-runtime.log > godot-validation.log

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot get class|Failed loading resource" godot-validation.log; then
            echo "Godot reported script or resource loading errors."
            exit 1
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-log
          path: |
            godot-import.log
            godot-runtime.log
            godot-validation.log
          if-no-files-found: ignore
