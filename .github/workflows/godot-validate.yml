name: Godot Project Validation

on:
  push:
    branches:
      - main
      - refactor/adaptive-display-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI-only asset placeholders
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' import_file; do
            source_file="${import_file%.import}"

            if [ -f "$source_file" ]; then
              continue
            fi

            extension="${source_file##*.}"
            echo "Missing raw asset: $source_file"

            case "$extension" in
              png)
                printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl8gWQAAAAASUVORK5CYII=' \
                  | base64 --decode > "$source_file"
                ;;
              ttf)
                cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$source_file"
                ;;
              *)
                echo "Unsupported missing asset type: $source_file"
                exit 1
                ;;
            esac

            rm -f "$import_file"
          done < <(find data -type f -name '*.import' -print0)

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --quit-after 10 \
            --verbose 2>&1 | tee godot-import.log

      - name: Run main scene headlessly
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --quit-after 2 \
            --verbose \
            core/main.tscn 2>&1 | tee godot-runtime.log

      - name: Reject script and resource errors
        run: |
          cat godot-import.log godot-runtime.log > godot-validation.log

          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot get class|Failed loading resource" godot-validation.log; then
            echo "Godot reported script or resource loading errors."
            exit 1
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-log
          path: |
            godot-import.log
            godot-runtime.log
            godot-validation.log
          if-no-files-found: ignore
