name: Social Foundation Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-social-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI-only asset placeholders
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' import_file; do
            source_file="${import_file%.import}"
            if [ ! -f "$source_file" ]; then
              extension="${source_file##*.}"
              case "$extension" in
                png)
                  printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4////fwAJ+wP9KobjigAAAABJRU5ErkJggg==' | base64 --decode > "$source_file"
                  ;;
                ttf)
                  cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$source_file"
                  ;;
                *)
                  echo "Unsupported missing asset type: $source_file"
                  exit 1
                  ;;
              esac
            fi
            rm -f "$import_file"
          done < <(find data -type f -name '*.import' -print0)
          sed -i '/^theme\/custom=/d' project.godot

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --editor --path . --import --verbose \
            2>&1 | tee godot-social-import.log

      - name: Run NPC social foundation test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 60 \
            tests/social/npc_social_foundation_test.tscn \
            2>&1 | tee godot-social-foundation-test.log
          grep -q "NPC_SOCIAL_FOUNDATION_TEST: PASS" \
            godot-social-foundation-test.log

      - name: Run social conversation engine test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 90 \
            tests/social/social_conversation_engine_test.tscn \
            2>&1 | tee godot-social-conversation-test.log
          grep -q "SOCIAL_CONVERSATION_ENGINE_TEST: PASS" \
            godot-social-conversation-test.log

      - name: Run Social App test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 90 \
            tests/social/social_app_test.tscn \
            2>&1 | tee godot-social-app-test.log
          grep -q "SOCIAL_APP_TEST: PASS" godot-social-app-test.log

      - name: Reject script and resource errors
        shell: bash
        run: |
          cat \
            godot-social-import.log \
            godot-social-foundation-test.log \
            godot-social-conversation-test.log \
            godot-social-app-test.log \
            > godot-social-validation.log
          if grep -E "SCRIPT ERROR|Failed to load script|Cannot get class|Parse Error" godot-social-validation.log; then
            exit 1
          fi

      - name: Upload social validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-foundation-validation-log
          path: |
            godot-social-import.log
            godot-social-foundation-test.log
            godot-social-conversation-test.log
            godot-social-app-test.log
            godot-social-validation.log
          if-no-files-found: ignore
