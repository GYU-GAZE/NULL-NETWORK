name: Starter Selection Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-starter-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI-only asset placeholders
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot /tmp/project.godot.original

          while IFS= read -r -d '' import_file; do
            source_file="${import_file%.import}"

            if [ ! -f "$source_file" ]; then
              extension="${source_file##*.}"

              case "$extension" in
                png)
                  printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4////fwAJ+wP9KobjigAAAABJRU5ErkJggg==' \
                    | base64 --decode > "$source_file"
                  ;;
                ttf)
                  cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$source_file"
                  ;;
                *)
                  echo "Unsupported missing asset type: $source_file"
                  exit 1
                  ;;
              esac
            fi

            rm -f "$import_file"
          done < <(find data -type f -name '*.import' -print0)

          sed -i '/^theme\/custom=/d' project.godot

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --editor --path . --import --verbose \
            2>&1 | tee godot-starter-selection-import.log

      - name: Run first-account starter selection test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 180 \
            tests/commitment/initial_starter_selection_page_test.tscn \
            2>&1 | tee godot-initial-starter-selection-test.log
          grep -q "INITIAL_STARTER_SELECTION_PAGE_TEST: PASS" \
            godot-initial-starter-selection-test.log

      - name: Run Operator Loss starter selection test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path . --quit-after 180 \
            tests/commitment/starter_selection_page_test.tscn \
            2>&1 | tee godot-starter-selection-test.log
          grep -q "STARTER_SELECTION_PAGE_TEST: PASS" \
            godot-starter-selection-test.log

      - name: Reject script and resource errors
        shell: bash
        run: |
          cat \
            godot-starter-selection-import.log \
            godot-initial-starter-selection-test.log \
            godot-starter-selection-test.log \
            > godot-starter-selection-validation.log

          if grep -E "SCRIPT ERROR|Failed to load script|Cannot get class|Parse Error" godot-starter-selection-validation.log; then
            exit 1
          fi

      - name: Restore project settings
        if: always()
        run: cp /tmp/project.godot.original project.godot

      - name: Upload starter selection validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-selection-validation-log
          path: |
            godot-starter-selection-import.log
            godot-initial-starter-selection-test.log
            godot-starter-selection-test.log
            godot-starter-selection-validation.log
          if-no-files-found: ignore
