name: Power Damage Targeted Validation

on:
  push:
    branches:
      - balance/power-damage-heal-scaling
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-power-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI-only asset placeholders
        shell: bash
        run: |
          set -euo pipefail
          cp project.godot /tmp/project.godot.original

          while IFS= read -r -d '' import_file; do
            source_file="${import_file%.import}"
            if [ ! -f "$source_file" ]; then
              extension="${source_file##*.}"
              echo "Missing raw asset: $source_file"
              case "$extension" in
                png)
                  printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4////fwAJ+wP9KobjigAAAABJRU5ErkJggg==' | base64 --decode > "$source_file"
                  ;;
                ttf)
                  cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf "$source_file"
                  ;;
                *)
                  echo "Unsupported missing asset type: $source_file"
                  exit 1
                  ;;
              esac
            fi
            rm -f "$import_file"
          done < <(find data -type f -name '*.import' -print0)

          sed -i '/^theme\/custom=/d' project.godot

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 3 --output godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path . --import 2>&1 | tee godot-import.log

      - name: Run combat numbers formula test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 60 tests/combat/combat_numbers_formula_test.tscn 2>&1 | tee combat-numbers-test.log
          grep -q "COMBAT_NUMBERS_FORMULA_TEST: PASS" combat-numbers-test.log

      - name: Run APK progression test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 180 tests/progression/apk_progression_test.tscn 2>&1 | tee apk-progression-test.log
          grep -q "APK_PROGRESSION_TEST: PASS" apk-progression-test.log

      - name: Run real-damage Operator Loss test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 180 tests/commitment/operator_loss_real_damage_test.tscn 2>&1 | tee operator-loss-real-damage-test.log
          grep -q "OPERATOR_LOSS_REAL_DAMAGE_TEST: PASS" operator-loss-real-damage-test.log

      - name: Run combat campaign resolution test
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 240 tests/combat/combat_campaign_resolution_test.tscn 2>&1 | tee combat-campaign-resolution-test.log
          grep -q "COMBAT_CAMPAIGN_RESOLUTION_TEST: PASS" combat-campaign-resolution-test.log
